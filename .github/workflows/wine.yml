name: wine-offer-check
on:
  schedule:
    - cron: "17 7 * * *"   # daily, 07:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python wine_check.py --selftest
      - run: python wine_check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save state
        run: |
          git config user.name "wine-bot"; git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
